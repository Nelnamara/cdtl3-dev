<title>CDTL3 Walk Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one narrow column. A summary "lane" on top (marks fill it like icons on a timeline),
   then each walk as a section of lines; every line carries its own marks and a note. */
:root {
	--bg: #f3f5f4;
	--surface: #ffffff;
	--fg: #18211f;
	--muted: #5c6b67;
	--line: #d6dedb;
	--accent: #0f6b62;
	--pass: #1f8a4c;
	--fail: #c0392b;
	--later: #b7791f;
	--on-mark: #ffffff;
	--font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
	--font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #121816; --surface: #1a2220; --fg: #e6eeeb; --muted: #94a5a0; --line: #2c3936;
		--accent: #4fc4b6; --pass: #3fb872; --fail: #e8695b; --later: #e0a94a; --on-mark: #0d1211;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #121816; --surface: #1a2220; --fg: #e6eeeb; --muted: #94a5a0; --line: #2c3936;
	--accent: #4fc4b6; --pass: #3fb872; --fail: #e8695b; --later: #e0a94a; --on-mark: #0d1211;
	color-scheme: dark;
}
body {
	background: var(--bg);
	color: var(--fg);
	font-family: var(--font-body);
	font-size: 15px;
	line-height: 1.5;
}
.page {
	max-width: 760px;
	margin: 0 auto;
	padding-block: 28px 56px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	display: flex;
	flex-direction: column;
	gap: 28px;
}
h1, h2, h3 { font-family: var(--font-head); text-wrap: balance; margin: 0; }
h1 { font-size: 26px; font-weight: 600; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 12px; }
.sub { color: var(--muted); margin: 0; }
.lane {
	display: flex; height: 10px; border-radius: 5px; overflow: hidden;
	background: var(--line);
}
.lane span { display: block; height: 100%; }
.lane .p { background: var(--pass); }
.lane .f { background: var(--fail); }
.lane .l { background: var(--later); }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; color: var(--muted); }
.counts b { color: var(--fg); font-weight: 600; }
.status { color: var(--muted); margin: 0; }
.status.warn { color: var(--later); }
.walk { display: flex; flex-direction: column; gap: 14px; }
.walk-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.walk-head small { color: var(--muted); font-variant-numeric: tabular-nums; }
.group { display: flex; flex-direction: column; gap: 8px; }
.item {
	background: var(--surface);
	border: 1px solid var(--line);
	border-left: 4px solid var(--line);
	border-radius: 6px;
	padding: 12px 14px;
	display: flex; flex-direction: column; gap: 10px;
	min-width: 0;
}
.item[data-status="pass"], .item[data-status="keep"] { border-left-color: var(--pass); }
.item[data-status="fail"], .item[data-status="change"] { border-left-color: var(--fail); }
.item[data-status="later"] { border-left-color: var(--later); }
.item p { margin: 0; overflow-wrap: anywhere; }
.item code { font-size: 0.93em; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.marks { display: flex; gap: 6px; }
.marks button {
	font: inherit; font-weight: 500; font-size: 13px;
	padding: 6px 12px; border-radius: 5px; cursor: pointer;
	border: 1px solid var(--line); background: transparent; color: var(--fg);
}
.marks button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.marks button[aria-pressed="true"] { color: var(--on-mark); border-color: transparent; }
.marks button[data-mark="pass"][aria-pressed="true"], .marks button[data-mark="keep"][aria-pressed="true"] { background: var(--pass); }
.marks button[data-mark="fail"][aria-pressed="true"], .marks button[data-mark="change"][aria-pressed="true"] { background: var(--fail); }
.marks button[data-mark="later"][aria-pressed="true"] { background: var(--later); }
.marks button:disabled { opacity: 0.5; cursor: default; }
textarea {
	flex: 1 1 220px; min-width: 0; min-height: 34px; resize: vertical;
	font: inherit; font-size: 13.5px; color: var(--fg);
	background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px;
}
.saved { font-size: 12px; color: var(--muted); min-height: 1em; }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 20px; color: var(--muted); }
#walks, #done { display: flex; flex-direction: column; gap: 36px; }
#done { gap: 10px; }
.all { color: var(--muted); margin: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#done-wrap { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 20px; }
details.folded { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
details.folded > summary {
	cursor: pointer; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
	font-family: var(--font-head); font-weight: 600; font-size: 16px;
}
details.folded > summary small { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
details.folded[open] > summary { border-bottom: 1px solid var(--line); }
details.folded > .walk { padding: 16px 14px; }
</style>

<div class="page">
	<header class="head">
		<h1>CDTL3 Walk Sheet</h1>
		<p class="sub">Test lines for Cooldown Timeline 3 builds. Mark each line Pass, Fail or Later (can't try it yet) and add a note where something looks off. Marks save as you go.</p>
		<div class="lane" id="lane" role="img" aria-label="Progress"></div>
		<div class="counts" id="counts"></div>
		<p class="all" id="all" hidden></p>
		<p class="status" id="status">Loading saved marks…</p>
	</header>
	<main id="walks">
		<div class="empty" id="empty">No walk lines yet. Lines appear here when a test build is ready to try.</div>
	</main>
	<section id="done-wrap" hidden>
		<h3>Finished walks</h3>
		<div id="done"></div>
	</section>
</div>

<script>
(function () {
	var MARKS = { check: ["pass", "fail", "later"], call: ["keep", "change"] };
	var LABEL = { pass: "Pass", fail: "Fail", later: "Later", keep: "Keep", change: "Change" };
	var els = {};          // doc id -> { root, buttons, note, saved }
	var items = {};        // doc id -> data
	var queues = {};       // doc id -> promise chain (one write at a time per document)
	var noteTimers = {};
	var dirty = {};        // doc id -> note typed but not saved yet
	var shape = "";        // the layout last drawn; redrawn only when lines are added, removed, moved or folded
	var heads = {};        // walk -> its count labels
	var touched = {};      // walks marked in this visit stay in place until the next visit
	var foldOpen = {};     // finished walk -> unfolded
	var db = null;
	var readOnly = false;
	var statusEl = document.getElementById("status");
	var walksEl = document.getElementById("walks");
	var emptyEl = document.getElementById("empty");
	var doneEl = document.getElementById("done");
	var doneWrap = document.getElementById("done-wrap");
	var allEl = document.getElementById("all");

	function setStatus(text, warn) {
		statusEl.textContent = text;
		statusEl.className = warn ? "status warn" : "status";
		statusEl.hidden = !text;
	}

	// plain text with `code` spans; everything set as text, never as HTML
	function fillText(p, text) {
		p.textContent = "";
		String(text || "").split("`").forEach(function (part, i) {
			if (i % 2 === 1) {
				var c = document.createElement("code");
				c.textContent = part;
				p.appendChild(c);
			} else if (part) {
				p.appendChild(document.createTextNode(part));
			}
		});
	}

	// moving a note box out of the page and back drops the cursor; put it back where it was
	function keepFocus(redraw) {
		var box = document.activeElement, start = 0, end = 0;
		if (!box || box.tagName !== "TEXTAREA") { box = null; }
		if (box) { start = box.selectionStart; end = box.selectionEnd; }
		redraw();
		if (box && box.isConnected && document.activeElement !== box) {
			box.focus({ preventScroll: true });
			try { box.setSelectionRange(start, end); } catch (e) {}
		}
	}

	function write(id, patch) {
		if (!db || readOnly) { return; }
		var ui = els[id];
		var run = function () {
			return db.collection("items").doc(id).update(patch).then(function () {
				if (ui) { ui.saved.textContent = "Saved"; }
			}, function (e) {
				if (e && e.code === "invalid_argument") {
					readOnly = true;
					setStatus("You can read this sheet but not change it.", true);
					render();
				} else if (ui) {
					ui.saved.textContent = "Not saved. Try again.";
				}
			});
		};
		queues[id] = (queues[id] || Promise.resolve()).then(run, run);
	}

	function build(id) {
		var root = document.createElement("div");
		root.className = "item";
		var text = document.createElement("p");
		var row = document.createElement("div");
		row.className = "row";
		var marks = document.createElement("div");
		marks.className = "marks";
		var note = document.createElement("textarea");
		note.id = "note-" + id;
		note.rows = 1;
		note.placeholder = "Note";
		note.setAttribute("aria-label", "Note");
		var saved = document.createElement("div");
		saved.className = "saved";
		note.addEventListener("input", function () {
			clearTimeout(noteTimers[id]);
			dirty[id] = true;
			saved.textContent = "";
			noteTimers[id] = setTimeout(function () { saveNote(id); }, 900);
		});
		note.addEventListener("blur", function () {
			clearTimeout(noteTimers[id]);
			saveNote(id);
		});
		row.appendChild(marks);
		row.appendChild(note);
		root.appendChild(text);
		root.appendChild(row);
		root.appendChild(saved);
		els[id] = { root: root, text: text, marks: marks, buttons: {}, note: note, saved: saved, kind: null };
		return els[id];
	}

	function saveNote(id) {
		var ui = els[id], d = items[id];
		if (!ui || !d) { return; }
		var v = ui.note.value;
		dirty[id] = false;
		if (v === (d.note || "")) { return; }
		d.note = v;
		write(id, { note: v, updatedAt: new Date().toISOString() });
	}

	function setMark(id, mark) {
		var d = items[id];
		if (!d) { return; }
		var next = d.status === mark ? "" : mark;
		touched[d.walk] = true;
		d.status = next;
		paint(id);
		render();
		write(id, { status: next, updatedAt: new Date().toISOString() });
	}

	function paint(id) {
		var ui = els[id] || build(id), d = items[id];
		var kind = MARKS[d.kind] ? d.kind : "check";
		if (ui.kind !== kind) {
			ui.kind = kind;
			ui.marks.textContent = "";
			ui.buttons = {};
			MARKS[kind].forEach(function (m) {
				var b = document.createElement("button");
				b.type = "button";
				b.dataset.mark = m;
				b.textContent = LABEL[m];
				b.addEventListener("click", function () { setMark(id, m); });
				ui.marks.appendChild(b);
				ui.buttons[m] = b;
			});
		}
		if (ui.shownText !== d.text) {
			ui.shownText = d.text;
			fillText(ui.text, d.text);
		}
		ui.root.dataset.status = d.status || "";
		Object.keys(ui.buttons).forEach(function (m) {
			ui.buttons[m].setAttribute("aria-pressed", d.status === m ? "true" : "false");
			ui.buttons[m].disabled = readOnly;
		});
		ui.note.readOnly = readOnly;
		// never refill a box being typed in or holding unsaved typing (a redraw takes the focus away for a moment)
		if (document.activeElement !== ui.note && !dirty[id] && ui.note.value !== (d.note || "")) {
			ui.note.value = d.note || "";
		}
	}

	function tally(ids) {
		var n = { pass: 0, fail: 0, later: 0, open: 0, total: ids.length };
		ids.forEach(function (id) {
			var s = items[id].status;
			if (s === "pass" || s === "keep") { n.pass++; }
			else if (s === "fail" || s === "change") { n.fail++; }
			else if (s === "later") { n.later++; }
			else { n.open++; }
		});
		return n;
	}

	function countLine(n) {
		var parts = [];
		if (n.pass) { parts.push(n.pass + " pass"); }
		if (n.fail) { parts.push(n.fail + " fail"); }
		if (n.later) { parts.push(n.later + " later"); }
		if (n.open) { parts.push(n.open + " open"); }
		return parts.join(" · ");
	}

	// the top counts cover the walks still open; the line under them covers every walk
	function summary(list) {
		list = list || [];
		var shownIds = [], allIds = Object.keys(items), folded = 0;
		list.forEach(function (w) { if (w.fold) { folded++; } else { shownIds = shownIds.concat(w.ids); } });
		var n = tally(shownIds), total = n.total;
		var lane = document.getElementById("lane");
		lane.textContent = "";
		[["p", n.pass], ["f", n.fail], ["l", n.later]].forEach(function (seg) {
			if (total && seg[1]) {
				var s = document.createElement("span");
				s.className = seg[0];
				s.style.width = (seg[1] / total * 100) + "%";
				lane.appendChild(s);
			}
		});
		var counts = document.getElementById("counts");
		counts.textContent = "";
		[["Pass", n.pass], ["Fail", n.fail], ["Later", n.later], ["Open", n.open], ["Lines", total]].forEach(function (c) {
			var span = document.createElement("span");
			var b = document.createElement("b");
			b.textContent = c[1];
			span.appendChild(b);
			span.appendChild(document.createTextNode(" " + c[0]));
			counts.appendChild(span);
		});
		if (folded) {
			var a = tally(allIds);
			allEl.textContent = "All " + list.length + " walks: " + a.pass + " pass · " + a.fail + " fail · " + a.later + " later · " + a.open + " open";
		}
		allEl.hidden = !folded;
	}

	// walks with unmarked lines on top, newest first; a walk with every line marked folds below
	// (unless marked in this visit); inside a walk, lines in their order under their headings
	function render() {
		var ids = Object.keys(items);
		emptyEl.hidden = ids.length > 0;
		var byWalk = {};
		ids.forEach(function (id) {
			var d = items[id], key = d.walk || "walk";
			var w = byWalk[key] || (byWalk[key] = { id: key, title: "", added: "", last: "", ids: [] });
			w.ids.push(id);
			if (!w.title && d.walkTitle) { w.title = d.walkTitle; }
			if ((d.added || "") > w.added) { w.added = d.added; }
			if ((d.updatedAt || "") > w.last) { w.last = d.updatedAt; }
		});
		var list = Object.keys(byWalk).map(function (k) { return byWalk[k]; });
		list.forEach(function (w) {
			// walks from before 12 Nov carry no added time: the date their id starts with stands in,
			// and among those, the last mark breaks ties
			if (!w.added) {
				var m = /^(\d{4}-\d{2}-\d{2})/.exec(w.id);
				w.added = m ? m[1] + "T00:00:00Z" : "";
			}
			w.title = w.title || w.id;
			w.ids.sort(function (a, b) { return (items[a].order || 0) - (items[b].order || 0) || (a < b ? -1 : 1); });
			w.n = tally(w.ids);
			w.fold = w.n.open === 0 && !touched[w.id];
		});
		list.sort(function (a, b) {
			if (a.added !== b.added) { return a.added < b.added ? 1 : -1; }
			if (a.last !== b.last) { return a.last < b.last ? 1 : -1; }
			return a.id < b.id ? 1 : -1;
		});
		// a saved mark or note leaves the layout alone, so a box being typed in is never moved
		var next = list.map(function (w) {
			return [w.id, w.title, w.fold ? "f" : "o", w.ids.map(function (id) {
				return id + "\u0003" + (items[id].group || "");
			}).join(",")].join("\u0001");
		}).join("\u0002");
		if (next !== shape) {
			shape = next;
			keepFocus(function () { draw(list); });
		} else {
			list.forEach(function (w) { w.ids.forEach(paint); });
		}
		list.forEach(function (w) {
			(heads[w.id] || []).forEach(function (s) { s.textContent = countLine(w.n); });
		});
		summary(list);
	}

	function buildWalk(w) {
		var section = document.createElement("section");
		section.className = "walk";
		var head = document.createElement("div");
		head.className = "walk-head";
		var h = document.createElement("h2");
		h.textContent = w.title;
		var small = document.createElement("small");
		(heads[w.id] = heads[w.id] || []).push(small);
		head.appendChild(h);
		head.appendChild(small);
		section.appendChild(head);
		var group = null, lastGroup = null;
		w.ids.forEach(function (id) {
			var d = items[id];
			if (group === null || d.group !== lastGroup) {
				lastGroup = d.group;
				group = document.createElement("div");
				group.className = "group";
				if (d.group) {
					var g = document.createElement("h3");
					g.textContent = d.group;
					group.appendChild(g);
				}
				section.appendChild(group);
			}
			paint(id);
			group.appendChild(els[id].root);
		});
		return section;
	}

	function draw(list) {
		Array.prototype.slice.call(walksEl.querySelectorAll(".walk")).forEach(function (n) { n.remove(); });
		doneEl.textContent = "";
		heads = {};
		var folded = 0;
		list.forEach(function (w) {
			var section = buildWalk(w);
			if (w.fold) {
				var det = document.createElement("details");
				det.className = "folded";
				det.open = !!foldOpen[w.id];
				det.addEventListener("toggle", function () { foldOpen[w.id] = det.open; });
				var sum = document.createElement("summary");
				sum.appendChild(document.createTextNode(w.title));
				var small = document.createElement("small");
				heads[w.id].push(small);
				sum.appendChild(small);
				det.appendChild(sum);
				section.querySelector(".walk-head").hidden = true;
				det.appendChild(section);
				doneEl.appendChild(det);
				folded++;
			} else {
				walksEl.appendChild(section);
			}
		});
		doneWrap.hidden = folded === 0;
	}

	function start() {
		var use = window.claude && window.claude.use;
		if (!use) {
			setStatus("Saved marks can't be reached here. Open this sheet in Claude to mark lines.", true);
			summary();
			return;
		}
		var slow = setTimeout(function () {
			setStatus("Saved marks can't be reached yet. Still trying…", true);
		}, 10000);
		window.claude.use("db").then(function (store) {
			if (!store) {
				clearTimeout(slow);
				readOnly = true;
				setStatus("Saved marks aren't available in this view. Sign in to Claude to mark lines.", true);
				summary();
				return;
			}
			db = store;
			db.collection("items").onSnapshot(function (snap) {
				var seen = {};
				snap.docs.forEach(function (doc) {
					var d = doc.data() || {};
					seen[doc.id] = true;
					var mine = items[doc.id] || {};
					items[doc.id] = {
						walk: d.walk, walkTitle: d.walkTitle, group: d.group, order: d.order, kind: d.kind,
						text: d.text, status: d.status || "", note: d.note || "",
						added: typeof d.added === "string" ? d.added : "",
						updatedAt: typeof d.updatedAt === "string" ? d.updatedAt : ""
					};
					// a note being typed stays as typed until it is saved
					var ui = els[doc.id];
					if (ui && document.activeElement === ui.note) { items[doc.id].note = mine.note || items[doc.id].note; }
				});
				Object.keys(items).forEach(function (id) {
					if (!seen[id]) { delete items[id]; if (els[id]) { els[id].root.remove(); delete els[id]; } }
				});
				if (!snap.metadata.fromCache) {
					clearTimeout(slow);
					if (!readOnly) { setStatus(""); }
				}
				render();
			}, function () {
				clearTimeout(slow);
				setStatus("Saved marks stopped loading. Reopen the sheet to try again.", true);
			});
		});
	}

	summary();
	start();
})();
</script>
