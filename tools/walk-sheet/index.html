<title>CDTL3 Walk Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one narrow column. A summary "lane" on top (marks fill it like icons on a timeline),
   then each walk as a section of lines; every line carries its own marks and a note. */
:root {
	--bg: #f3f5f4;
	--surface: #ffffff;
	--fg: #18211f;
	--muted: #5c6b67;
	--line: #d6dedb;
	--accent: #0f6b62;
	--pass: #1f8a4c;
	--fail: #c0392b;
	--later: #b7791f;
	--on-mark: #ffffff;
	--font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
	--font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #121816; --surface: #1a2220; --fg: #e6eeeb; --muted: #94a5a0; --line: #2c3936;
		--accent: #4fc4b6; --pass: #3fb872; --fail: #e8695b; --later: #e0a94a; --on-mark: #0d1211;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #121816; --surface: #1a2220; --fg: #e6eeeb; --muted: #94a5a0; --line: #2c3936;
	--accent: #4fc4b6; --pass: #3fb872; --fail: #e8695b; --later: #e0a94a; --on-mark: #0d1211;
	color-scheme: dark;
}
body {
	background: var(--bg);
	color: var(--fg);
	font-family: var(--font-body);
	font-size: 15px;
	line-height: 1.5;
}
.page {
	max-width: 760px;
	margin: 0 auto;
	padding-block: 28px 56px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	display: flex;
	flex-direction: column;
	gap: 28px;
}
h1, h2, h3 { font-family: var(--font-head); text-wrap: balance; margin: 0; }
h1 { font-size: 26px; font-weight: 600; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 12px; }
.sub { color: var(--muted); margin: 0; }
.lane {
	display: flex; height: 10px; border-radius: 5px; overflow: hidden;
	background: var(--line);
}
.lane span { display: block; height: 100%; }
.lane .p { background: var(--pass); }
.lane .f { background: var(--fail); }
.lane .l { background: var(--later); }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; color: var(--muted); }
.counts b { color: var(--fg); font-weight: 600; }
.status { color: var(--muted); margin: 0; }
.status.warn { color: var(--later); }
.walk { display: flex; flex-direction: column; gap: 14px; }
.walk-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.walk-head small { color: var(--muted); font-variant-numeric: tabular-nums; }
.group { display: flex; flex-direction: column; gap: 8px; }
.item {
	background: var(--surface);
	border: 1px solid var(--line);
	border-left: 4px solid var(--line);
	border-radius: 6px;
	padding: 12px 14px;
	display: flex; flex-direction: column; gap: 10px;
	min-width: 0;
}
.item[data-status="pass"], .item[data-status="keep"] { border-left-color: var(--pass); }
.item[data-status="fail"], .item[data-status="change"] { border-left-color: var(--fail); }
.item[data-status="later"] { border-left-color: var(--later); }
.item p { margin: 0; overflow-wrap: anywhere; }
.item code { font-size: 0.93em; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.marks { display: flex; gap: 6px; }
.marks button {
	font: inherit; font-weight: 500; font-size: 13px;
	padding: 6px 12px; border-radius: 5px; cursor: pointer;
	border: 1px solid var(--line); background: transparent; color: var(--fg);
}
.marks button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.marks button[aria-pressed="true"] { color: var(--on-mark); border-color: transparent; }
.marks button[data-mark="pass"][aria-pressed="true"], .marks button[data-mark="keep"][aria-pressed="true"] { background: var(--pass); }
.marks button[data-mark="fail"][aria-pressed="true"], .marks button[data-mark="change"][aria-pressed="true"] { background: var(--fail); }
.marks button[data-mark="later"][aria-pressed="true"] { background: var(--later); }
.marks button:disabled { opacity: 0.5; cursor: default; }
textarea {
	flex: 1 1 220px; min-width: 0; min-height: 34px; resize: vertical;
	font: inherit; font-size: 13.5px; color: var(--fg);
	background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px;
}
.saved { font-size: 12px; color: var(--muted); min-height: 1em; }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 20px; color: var(--muted); }
</style>

<div class="page">
	<header class="head">
		<h1>CDTL3 Walk Sheet</h1>
		<p class="sub">Test lines for Cooldown Timeline 3 builds. Mark each line Pass, Fail or Later (can't try it yet) and add a note where something looks off. Marks save as you go.</p>
		<div class="lane" id="lane" role="img" aria-label="Progress"></div>
		<div class="counts" id="counts"></div>
		<p class="status" id="status">Loading saved marks…</p>
	</header>
	<main id="walks">
		<div class="empty" id="empty">No walk lines yet. Lines appear here when a test build is ready to try.</div>
	</main>
</div>

<script>
(function () {
	var MARKS = { check: ["pass", "fail", "later"], call: ["keep", "change"] };
	var LABEL = { pass: "Pass", fail: "Fail", later: "Later", keep: "Keep", change: "Change" };
	var els = {};          // doc id -> { root, buttons, note, saved }
	var items = {};        // doc id -> data
	var queues = {};       // doc id -> promise chain (one write at a time per document)
	var noteTimers = {};
	var db = null;
	var readOnly = false;
	var statusEl = document.getElementById("status");
	var walksEl = document.getElementById("walks");
	var emptyEl = document.getElementById("empty");

	function setStatus(text, warn) {
		statusEl.textContent = text;
		statusEl.className = warn ? "status warn" : "status";
		statusEl.hidden = !text;
	}

	// plain text with `code` spans; everything set as text, never as HTML
	function fillText(p, text) {
		p.textContent = "";
		String(text || "").split("`").forEach(function (part, i) {
			if (i % 2 === 1) {
				var c = document.createElement("code");
				c.textContent = part;
				p.appendChild(c);
			} else if (part) {
				p.appendChild(document.createTextNode(part));
			}
		});
	}

	function write(id, patch) {
		if (!db || readOnly) { return; }
		var ui = els[id];
		var run = function () {
			return db.collection("items").doc(id).update(patch).then(function () {
				if (ui) { ui.saved.textContent = "Saved"; }
			}, function (e) {
				if (e && e.code === "invalid_argument") {
					readOnly = true;
					setStatus("You can read this sheet but not change it.", true);
					render();
				} else if (ui) {
					ui.saved.textContent = "Not saved. Try again.";
				}
			});
		};
		queues[id] = (queues[id] || Promise.resolve()).then(run, run);
	}

	function build(id) {
		var root = document.createElement("div");
		root.className = "item";
		var text = document.createElement("p");
		var row = document.createElement("div");
		row.className = "row";
		var marks = document.createElement("div");
		marks.className = "marks";
		var note = document.createElement("textarea");
		note.id = "note-" + id;
		note.rows = 1;
		note.placeholder = "Note";
		note.setAttribute("aria-label", "Note");
		var saved = document.createElement("div");
		saved.className = "saved";
		note.addEventListener("input", function () {
			clearTimeout(noteTimers[id]);
			saved.textContent = "";
			noteTimers[id] = setTimeout(function () { saveNote(id); }, 900);
		});
		note.addEventListener("blur", function () {
			clearTimeout(noteTimers[id]);
			saveNote(id);
		});
		row.appendChild(marks);
		row.appendChild(note);
		root.appendChild(text);
		root.appendChild(row);
		root.appendChild(saved);
		els[id] = { root: root, text: text, marks: marks, buttons: {}, note: note, saved: saved, kind: null };
		return els[id];
	}

	function saveNote(id) {
		var ui = els[id], d = items[id];
		if (!ui || !d) { return; }
		var v = ui.note.value;
		if (v === (d.note || "")) { return; }
		d.note = v;
		write(id, { note: v, updatedAt: new Date().toISOString() });
	}

	function setMark(id, mark) {
		var d = items[id];
		if (!d) { return; }
		var next = d.status === mark ? "" : mark;
		d.status = next;
		paint(id);
		summary();
		write(id, { status: next, updatedAt: new Date().toISOString() });
	}

	function paint(id) {
		var ui = els[id] || build(id), d = items[id];
		var kind = MARKS[d.kind] ? d.kind : "check";
		if (ui.kind !== kind) {
			ui.kind = kind;
			ui.marks.textContent = "";
			ui.buttons = {};
			MARKS[kind].forEach(function (m) {
				var b = document.createElement("button");
				b.type = "button";
				b.dataset.mark = m;
				b.textContent = LABEL[m];
				b.addEventListener("click", function () { setMark(id, m); });
				ui.marks.appendChild(b);
				ui.buttons[m] = b;
			});
		}
		if (ui.shownText !== d.text) {
			ui.shownText = d.text;
			fillText(ui.text, d.text);
		}
		ui.root.dataset.status = d.status || "";
		Object.keys(ui.buttons).forEach(function (m) {
			ui.buttons[m].setAttribute("aria-pressed", d.status === m ? "true" : "false");
			ui.buttons[m].disabled = readOnly;
		});
		ui.note.readOnly = readOnly;
		if (document.activeElement !== ui.note && ui.note.value !== (d.note || "")) {
			ui.note.value = d.note || "";
		}
	}

	function summary() {
		var n = { pass: 0, fail: 0, later: 0, open: 0 }, total = 0;
		Object.keys(items).forEach(function (id) {
			var s = items[id].status;
			total++;
			if (s === "pass" || s === "keep") { n.pass++; }
			else if (s === "fail" || s === "change") { n.fail++; }
			else if (s === "later") { n.later++; }
			else { n.open++; }
		});
		var lane = document.getElementById("lane");
		lane.textContent = "";
		[["p", n.pass], ["f", n.fail], ["l", n.later]].forEach(function (seg) {
			if (total && seg[1]) {
				var s = document.createElement("span");
				s.className = seg[0];
				s.style.width = (seg[1] / total * 100) + "%";
				lane.appendChild(s);
			}
		});
		var counts = document.getElementById("counts");
		counts.textContent = "";
		[["Pass", n.pass], ["Fail", n.fail], ["Later", n.later], ["Open", n.open], ["Lines", total]].forEach(function (c) {
			var span = document.createElement("span");
			var b = document.createElement("b");
			b.textContent = c[1];
			span.appendChild(b);
			span.appendChild(document.createTextNode(" " + c[0]));
			counts.appendChild(span);
		});
	}

	// newest walk first; inside a walk, lines in their order, grouped under their heading
	function render() {
		var ids = Object.keys(items);
		emptyEl.hidden = ids.length > 0;
		ids.sort(function (a, b) {
			var x = items[a], y = items[b];
			if (x.walk !== y.walk) { return String(x.walk) < String(y.walk) ? 1 : -1; }
			return (x.order || 0) - (y.order || 0) || (a < b ? -1 : 1);
		});
		Array.prototype.slice.call(walksEl.querySelectorAll(".walk")).forEach(function (n) { n.remove(); });
		var section = null, group = null, lastWalk = null, lastGroup = null, openCount = {};
		ids.forEach(function (id) {
			var d = items[id];
			if (!d.status) { openCount[d.walk] = (openCount[d.walk] || 0) + 1; }
		});
		ids.forEach(function (id) {
			var d = items[id];
			if (d.walk !== lastWalk) {
				lastWalk = d.walk; lastGroup = null;
				section = document.createElement("section");
				section.className = "walk";
				var head = document.createElement("div");
				head.className = "walk-head";
				var h = document.createElement("h2");
				h.textContent = d.walkTitle || d.walk || "Walk";
				var small = document.createElement("small");
				small.textContent = (openCount[d.walk] || 0) + " open";
				head.appendChild(h);
				head.appendChild(small);
				section.appendChild(head);
				walksEl.appendChild(section);
			}
			if (d.group !== lastGroup) {
				lastGroup = d.group;
				group = document.createElement("div");
				group.className = "group";
				if (d.group) {
					var g = document.createElement("h3");
					g.textContent = d.group;
					group.appendChild(g);
				}
				section.appendChild(group);
			}
			paint(id);
			group.appendChild(els[id].root);
		});
		summary();
	}

	function start() {
		var use = window.claude && window.claude.use;
		if (!use) {
			setStatus("Saved marks can't be reached here. Open this sheet in Claude to mark lines.", true);
			summary();
			return;
		}
		var slow = setTimeout(function () {
			setStatus("Saved marks can't be reached yet. Still trying…", true);
		}, 10000);
		window.claude.use("db").then(function (store) {
			if (!store) {
				clearTimeout(slow);
				readOnly = true;
				setStatus("Saved marks aren't available in this view. Sign in to Claude to mark lines.", true);
				summary();
				return;
			}
			db = store;
			db.collection("items").onSnapshot(function (snap) {
				var seen = {};
				snap.docs.forEach(function (doc) {
					var d = doc.data() || {};
					seen[doc.id] = true;
					var mine = items[doc.id] || {};
					items[doc.id] = {
						walk: d.walk, walkTitle: d.walkTitle, group: d.group, order: d.order, kind: d.kind,
						text: d.text, status: d.status || "", note: d.note || ""
					};
					// a note being typed stays as typed until it is saved
					var ui = els[doc.id];
					if (ui && document.activeElement === ui.note) { items[doc.id].note = mine.note || items[doc.id].note; }
				});
				Object.keys(items).forEach(function (id) {
					if (!seen[id]) { delete items[id]; if (els[id]) { els[id].root.remove(); delete els[id]; } }
				});
				if (!snap.metadata.fromCache) {
					clearTimeout(slow);
					if (!readOnly) { setStatus(""); }
				}
				render();
			}, function () {
				clearTimeout(slow);
				setStatus("Saved marks stopped loading. Reopen the sheet to try again.", true);
			});
		});
	}

	summary();
	start();
})();
</script>
